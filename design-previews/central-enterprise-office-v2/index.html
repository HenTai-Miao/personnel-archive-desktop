<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23142c43'/%3E%3Cpath d='M8 7h16v18H8z' fill='%23fff'/%3E%3Cpath d='M11 12h10M11 16h10M11 20h7' stroke='%239b242b' stroke-width='2'/%3E%3C/svg%3E" />
    <title>人员档案助手 · 国央企办公风格五版比较</title>
    <style>
      :root {
        color: #172738;
        background: #e7ebef;
        font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }

      body {
        display: grid;
        grid-template-rows: 58px 64px minmax(0, 1fr);
        min-width: 1080px;
        overflow: hidden;
      }

      .compare-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        color: #fff;
        background: #142c43;
        border-top: 4px solid #9b242b;
        border-bottom: 1px solid #0b1d2e;
      }

      .compare-title { display: flex; gap: 14px; align-items: baseline; }
      .compare-title strong { font-size: 16px; letter-spacing: .04em; }
      .compare-title span { color: #aebdca; font-size: 11px; }

      .compare-actions { display: flex; gap: 8px; }
      .compare-actions button {
        height: 30px;
        padding: 0 12px;
        color: #e9f0f5;
        background: transparent;
        border: 1px solid #617587;
        border-radius: 2px;
        cursor: pointer;
        font: inherit;
        font-size: 11px;
      }
      .compare-actions button:hover { background: rgb(255 255 255 / 8%); }

      .option-tabs {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 1px;
        padding: 1px;
        background: #b7c0c8;
        border-bottom: 1px solid #9ca8b2;
      }

      .option-tabs button {
        min-width: 0;
        padding: 9px 14px 8px;
        color: #405264;
        background: #f6f7f8;
        border: 0;
        cursor: pointer;
        text-align: left;
        font: inherit;
      }
      .option-tabs button:hover { background: #fff; }
      .option-tabs button.active {
        color: #152f48;
        background: #fff;
        box-shadow: inset 0 -3px #9b242b;
      }
      .option-tabs b,
      .option-tabs small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .option-tabs b { font-size: 12px; }
      .option-tabs small { margin-top: 4px; color: #74818d; font-size: 10px; font-weight: 400; }

      #preview { width: 100%; height: 100%; background: #fff; border: 0; }

      @media (max-width: 1240px) {
        .compare-title span,
        .option-tabs small { display: none; }
        .option-tabs button { text-align: center; }
      }
    </style>
  </head>
  <body>
    <header class="compare-bar">
      <div class="compare-title">
        <strong>人员档案助手 · 第二轮五版比较</strong>
        <span>同一业务内容，比较不同的国央企办公信息架构</span>
      </div>
      <div class="compare-actions">
        <button id="reload-current" type="button">刷新本版</button>
        <button id="open-current" type="button">单独打开本版</button>
      </div>
    </header>
    <nav class="option-tabs" aria-label="设计方案">
      <button class="active" data-src="option-1.html"><b>01 总部稳健门户</b><small>推荐 · 稳妥、清晰、适配面广</small></button>
      <button data-src="option-2.html"><b>02 双层综合办公</b><small>门户逻辑 · 模块边界最清楚</small></button>
      <button data-src="option-3.html"><b>03 档案阅办工作台</b><small>业务特征 · 查档效率最高</small></button>
      <button data-src="option-4.html"><b>04 红蓝公文台账</b><small>正式克制 · 公文气质最强</small></button>
      <button data-src="option-5.html"><b>05 高密度业务台</b><small>多任务 · 综合操作能力最强</small></button>
    </nav>
    <iframe id="preview" title="国央企办公风格设计预览" src="option-1.html"></iframe>
    <script>
      const preview = document.querySelector("#preview")
      const buttons = [...document.querySelectorAll(".option-tabs button")]

      const selectOption = (button) => {
        buttons.forEach((item) => item.classList.toggle("active", item === button))
        preview.src = button.dataset.src
        location.hash = button.dataset.src.replace("option-", "").replace(".html", "")
      }

      buttons.forEach((button) => button.addEventListener("click", () => selectOption(button)))
      document.querySelector("#reload-current").addEventListener("click", () => {
        preview.src = preview.src
      })
      document.querySelector("#open-current").addEventListener("click", () => {
        window.open(preview.src, "_blank", "noopener")
      })

      const initial = buttons.find((button) => button.dataset.src === `option-${location.hash.slice(1)}.html`)
      if (initial) selectOption(initial)
    </script>
  </body>
</html>
